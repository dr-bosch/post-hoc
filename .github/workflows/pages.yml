name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_mode:
        description: Choose an incremental sync or a full rebuild
        type: choice
        options:
          - sync
          - full
        default: sync
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous atom build state
        id: restore-atom-state
        uses: actions/cache/restore@v4
        with:
          path: |
            atoms.json
            atoms.csv
            atoms.md
            build/atom-build-status.json
            build/atom-build-status.md
          key: atom-sync-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            atom-sync-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test atom builder
        run: python -m unittest discover -s tests -v

      - name: Build or synchronize atom exports
        env:
          BASE_REF: ${{ github.event.before }}
          BUILD_MODE: ${{ inputs.build_mode }}
          CACHE_MATCHED_KEY: ${{ steps.restore-atom-state.outputs.cache-matched-key }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$CACHE_MATCHED_KEY" ]; then
              python scrape-atoms.py --sync --base-ref "$BASE_REF"
            else
              python scrape-atoms.py --base-ref "$BASE_REF"
            fi
          elif [ "$BUILD_MODE" = "sync" ]; then
            python scrape-atoms.py --sync
          else
            python scrape-atoms.py
          fi

      - name: Save atom build state
        uses: actions/cache/save@v4
        with:
          path: |
            atoms.json
            atoms.csv
            atoms.md
            build/atom-build-status.json
            build/atom-build-status.md
          key: atom-sync-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
